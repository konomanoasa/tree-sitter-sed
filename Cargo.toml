[package]
name = "tree-sitter-sed"
version = "0.24.0"
description = "Tree-sitter grammars for GNU sed 4.10."
readme = "README.md"
license = "MIT"
repository = "https://github.com/konomanoasa/tree-sitter-sed"
edition = "2024"
build = "bindings/rust/build.rs"
links = "tree-sitter-sed"
include = [
  "/LICENSE",
  "/README.md",
  "/bindings/rust/*.rs",
  "/common/**/*.h",
  "/queries/*.scm",
  "/sed_ere/src/*.c",
  "/sed_ere/src/node-types.json",
  "/sed_ere/src/tree_sitter/*.h",
  "/src/*.c",
  "/src/node-types.json",
  "/src/tree_sitter/*.h",
  "/test/bindings.test.rs",
]

[lib]
path = "bindings/rust/lib.rs"

[[test]]
name = "bindings"
path = "test/bindings.test.rs"

[dependencies]
tree-sitter-language = "=0.1.9"

[dev-dependencies]
tree-sitter = "=0.27.1"

[build-dependencies]
cc = "=1.10.0"
